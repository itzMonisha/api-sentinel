# ==============================================================================
# API Sentinel — Production Multi-Container Orchestration (docker-compose.prod.yml)
# ==============================================================================
# Deploys:
#   1. Managed PostgreSQL 16 with health checks and persistent volume
#   2. Spring Boot 3 Backend container with zero-trust network defense and Flyway
#   3. Optimized React Frontend Nginx container with SPA routing & reverse proxy
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-sentinel-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-api_sentinel}
      POSTGRES_USER: ${DB_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be configured in environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sentinel_user} -d ${DB_NAME:-api_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel-prod-net
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-sentinel-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-api_sentinel}
      DB_USER: ${DB_USER:-sentinel_user}
      DB_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD must be configured in environment}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET must be configured in environment}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      ALLOW_LOCAL_TARGETS: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://localhost}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sentinel-prod-net
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-sentinel-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - sentinel-prod-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_prod_data:
    driver: local

networks:
  sentinel-prod-net:
    driver: bridge
