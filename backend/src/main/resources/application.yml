spring:
  application:
    name: api-sentinel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Spring Boot Actuator Observability
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
    info:
      enabled: true

# API Sentinel Application-Level Settings
api-sentinel:
  security:
    allow-local-targets: ${ALLOW_LOCAL_TARGETS:false}
    jwt:
      secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  outbound:
    connect-timeout-ms: ${OUTBOUND_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OUTBOUND_READ_TIMEOUT_MS:10000}
    max-response-bytes: ${OUTBOUND_MAX_RESPONSE_BYTES:5242880}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# SpringDoc OpenAPI Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
