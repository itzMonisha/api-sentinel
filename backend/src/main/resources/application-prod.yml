spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:api_sentinel}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER:sentinel_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_POOL_TIMEOUT:30000}
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: SentinelProdHikariPool
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true
    validate-on-migrate: true

# Outbound Scanning Zero-Trust Security Policy:
# Local/internal infrastructure access is STRICTLY FORBIDDEN in production.
api-sentinel:
  security:
    allow-local-targets: false
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://api-sentinel.dev,https://app.apisentinel.dev}

# Production Actuator Exposure Policy:
# Publicly expose only health and info; restrict metrics and admin details
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}

logging:
  level:
    root: INFO
    com.sentinel: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
