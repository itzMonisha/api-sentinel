name: API Sentinel CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-build:
    name: Backend Build, Test & Docker Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_sentinel_test
          POSTGRES_USER: sentinel_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Execute Backend Tests & Verification
        working-directory: backend
        run: ./mvnw -B clean verify -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: api_sentinel_test
          DB_USER: sentinel_test
          DB_PASSWORD: test_password

      - name: Validate Backend Docker Build
        run: docker build -t api-sentinel-backend:ci ./backend

  frontend-build:
    name: Frontend Test, Build & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Validate Frontend Docker Build
        run: docker build -t api-sentinel-frontend:ci ./frontend
